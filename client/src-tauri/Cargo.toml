[package]
name = "asoultappo-client"
version = "1.2.6"
description = "AsoulTappo desktop pet client (Tauri 2)"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-only"

[lib]
name = "asoultappo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["updater"]
# Debug build for testers: more detailed log lines and a larger log file (src/applog.rs).
# Built by .github/workflows/debug-build.yml, never by the release workflow.
debug-log = []
# The online edition's updater (src/update.rs). It is the only dependency with an HTTP client.
updater = ["dep:tauri-plugin-updater"]
# The standalone edition: no updater, no race window, its own names (src/edition.rs). Built with
# `--no-default-features --features standalone` and tauri.standalone.conf.json (scripts/check_standalone.sh).
standalone = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", optional = true }
# The hide key (src/hotkey.rs).
tauri-plugin-global-shortcut = "2"
# Copying from the panel (copyText in src/composables/tauri.ts): WebKit refuses the web clipboard on the click
# that first focuses the panel.
tauri-plugin-clipboard-manager = "2"
# The tomato timer's notices from the system (notify in src/lib.rs).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Timeouts around the update check and its download (src/update.rs); already in the tree through Tauri.
tokio = { version = "1", features = ["time"] }
# Local timestamps in the exportable log (src/applog.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Global keyboard/mouse hooks on macOS and Linux; Windows uses its own hook (src/input.rs).
# We only ever forward event *kinds* and mouse deltas — never key identities.
# rdev 0.5 reads the keyboard layout off the main thread on every key and crashes on
# macOS 14+ (Narsil/rdev#146). The unreleased 0.6 can hand that lookup to the main
# thread (`set_is_main_thread(false)`); pinned to a reviewed commit.
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1" }

[target.'cfg(target_os = "macos")'.dependencies]
# Overlay placement, mouse coordinates and Spaces (src/overlay_macos.rs, src/lib.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry"] }
# One message to the capture window's web view (src/lib.rs); already in the tree through Tauri.
objc2 = "0.6"
# Decodes request paths in the macOS asset handler (src/media.rs); already in the tree through Tauri.
percent-encoding = "2"
# Shared HID access lets the pet read a PlayStation controller alongside a game.
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
# The overlay's web view: its process failures and its transparent background (src/transparency.rs). The versions
# wry uses, so the controller Tauri hands out is the type used here; already in the tree through Tauri.
webview2-com = "0.39"
windows-core = "0.62"
# XInput for game controllers (src/gamepad.rs), the stuck-drag check (src/lib.rs), the
# input hook and its watchdog (src/input.rs), pen tablets through Raw Input (src/tablet.rs), the overlay's tool-window subclass
# (src/tool_window.rs), the diagnostics written to the log (src/diag.rs), restarting as
# administrator (src/elevation.rs; ShellExecuteExW's struct needs Win32_System_Registry) and the
# overlay's transparency set again (src/transparency.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Input",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
# macOS builds override this with CARGO_PROFILE_RELEASE_PANIC=unwind (see the workflows):
# wry answers custom-protocol requests inside an Objective-C exception guard, and with
# abort an exception from an already cancelled request kills the app.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
