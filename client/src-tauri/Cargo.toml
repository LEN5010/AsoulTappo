[package]
name = "asoultappo-client"
version = "1.1.1"
description = "AsoulTappo desktop pet client (Tauri 2)"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-only"

[lib]
name = "asoultappo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Debug build for testers: more detailed log lines and a larger log file (src/applog.rs).
# Built by .github/workflows/debug-build.yml, never by the release workflow.
debug-log = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Timeouts around the update check and its download (src/update.rs); already in the tree through Tauri.
tokio = { version = "1", features = ["time"] }
# Local timestamps in the exportable log (src/applog.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Global keyboard/mouse hooks on macOS and Linux; Windows uses its own hook (src/input.rs).
# We only ever forward event *kinds* and mouse deltas — never key identities.
# rdev 0.5 reads the keyboard layout off the main thread on every key and crashes on
# macOS 14+ (Narsil/rdev#146). The unreleased 0.6 can hand that lookup to the main
# thread (`set_is_main_thread(false)`); pinned to a reviewed commit.
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1" }

[target.'cfg(target_os = "windows")'.dependencies]
# XInput for game controllers (src/gamepad.rs), the stuck-drag check (src/lib.rs), the
# input hook and its watchdog (src/input.rs), the overlay's tool-window subclass
# (src/tool_window.rs), the diagnostics written to the log (src/diag.rs) and restarting as
# administrator (src/elevation.rs; ShellExecuteExW's struct needs Win32_System_Registry).
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
