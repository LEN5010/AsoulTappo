[package]
name = "asoultappo-client"
version = "1.0.0"
description = "AsoulTappo desktop pet client (Tauri 2)"
edition = "2021"
rust-version = "1.77"
license = "GPL-2.0-only"

[lib]
name = "asoultappo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Global keyboard/mouse hooks (Windows low-level hooks under the hood).
# We only ever forward event *kinds* and mouse deltas — never key identities.
rdev = "0.5"
# Gamepad buttons, counted like keys. XInput instead of the default Windows.Gaming.Input,
# which may stop reporting while another window (a full-screen game) has focus.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
