[package]
name = "asoultappo-client"
version = "0.1.0-beta.6"
description = "AsoulTappo desktop pet client (Tauri 2)"
edition = "2021"
rust-version = "1.77"
license = "GPL-2.0-only"

[lib]
name = "asoultappo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Global keyboard/mouse hooks (Windows low-level hooks under the hood).
# We only ever forward event *kinds* and mouse deltas — never key identities.
rdev = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
