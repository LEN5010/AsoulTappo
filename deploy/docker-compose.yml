# Example self-hosted deployment: FastAPI server behind Caddy (auto HTTPS).
# Usage: DOMAIN=tappo.example.com docker compose up -d --build
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The image's command, plus the proxy's address as the only one whose X-Forwarded-For is taken: the server counts
    # per-address limits (room lookups, new saves) by each visitor's own address, not Caddy's. Change it together
    # with caddy's ipv4_address below.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ws", "websockets-sansio",
              "--proxy-headers", "--forwarded-allow-ips", "172.29.0.10"]
    networks:
      - tappo
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # Prices, odds and anti-cheat thresholds (server/app/economy.py); replace with your own file to tune them.
      ASOULTAPPO_ECONOMY: /srv/economy.example.json
    volumes:
      - server_data:/srv/data # SQLite: players, boxes, collection

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    networks:
      tappo:
        # Fixed, so the server can trust it alone (see the server's command).
        ipv4_address: 172.29.0.10
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  tappo:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          # Addresses Docker hands out itself stay clear of caddy's.
          ip_range: 172.29.0.128/25

volumes:
  server_data:
  caddy_data:
  caddy_config:
