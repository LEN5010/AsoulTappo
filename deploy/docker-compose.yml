# Example self-hosted deployment: FastAPI server behind Caddy (auto HTTPS).
# Usage: DOMAIN=tappo.example.com docker compose up -d --build
services:
  server:
    build:
      context: ../server
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
