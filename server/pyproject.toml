[project]
name = "asoultappo-server"
version = "0.1.0"
description = "AsoulTappo room server (FastAPI + WebSocket, in-memory)"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
