name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-nsis:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      # 发版说明只写在 .github/release-notes.md 一处。
      - name: read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_END'
            cat .github/release-notes.md
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: v__VERSION__
          releaseName: AsoulTappo v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis

  # 两边都会写同一份 latest.json。并行时后写的会把先写的平台条目盖掉，所以 macOS 等 Windows 结束再跑。
  macos-dmg:
    name: macOS DMG
    needs: windows-nsis
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      # 自签证书，让每个版本的签名身份一致，更新后输入监控权限不失效（scripts/macos_signing.sh）。
      - name: import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/macos_signing.sh import

      # tauri-action 按 tagName 找到已有的 Release 时会用 releaseBody 改写说明，Windows 跑完后在网页上手改的说明会被盖掉。
      # 这里改按 releaseId 上传，它就只传文件、不动说明；Windows 任务没建成 Release 时由这一步按说明文件新建。
      - name: find the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "AsoulTappo $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)" >> "$GITHUB_OUTPUT"
          # latest.json 的 notes 取 Release 页面上此刻的说明（tauri-action 用 releaseBody 写 notes）。
          {
            echo 'body<<RELEASE_NOTES_END'
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: AsoulTappo Signing
          # wry 在 Objective-C 异常保护里回应自定义协议请求；panic = "abort" 下，请求已被页面取消时抛出的异常会直接终止程序。
          CARGO_PROFILE_RELEASE_PANIC: unwind
        with:
          projectPath: client
          releaseId: ${{ steps.release.outputs.id }}
          releaseBody: ${{ steps.release.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target universal-apple-darwin --bundles app,dmg

      - name: check the signature
        run: scripts/macos_signing.sh verify client/src-tauri/target/universal-apple-darwin/release/bundle/macos/AsoulTappo.app

  # tauri-action 把 latest.json 的下载地址写成 api.github.com 的资产接口，不带令牌时每个 IP 每小时只能请求 60 次，
  # 共用出口 IP 的玩家容易用完，有的网络也只连得上 github.com。两个平台都写完后，改成 release 页面下载按钮用的地址。
  # 同时把 latest.json 的 notes 换成 Release 页面上现在的说明，网页上手改过的以手改为准。之后再手改说明，本地重跑这个脚本即可同步。
  updater-urls:
    name: latest.json 改用 github.com 下载地址
    needs: [windows-nsis, macos-dmg]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_updater_urls.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 单机版：同一个标签另打一份不联网的安装包（client/src-tauri/tauri.standalone.conf.json），文件名带 Offline。
  # 不带更新器、不写 latest.json；联机版的任务都不依赖它，它失败或变慢都不影响联机版发布。
  standalone:
    name: Standalone ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-latest
            args: --bundles nsis
            files: client/src-tauri/target/release/bundle/nsis/AsoulTappoOffline_*-setup.exe
          - name: macOS DMG
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            files: client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/AsoulTappoOffline_*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'macOS'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: standalone

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - name: import the signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/macos_signing.sh import

      # 第二个 -- 之后的参数交给 cargo：关掉默认的 updater feature。打包时要从 GitHub 下载 NSIS 工具，偶尔 504，重试只重新打包。
      - name: build
        working-directory: client
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export APPLE_SIGNING_IDENTITY="AsoulTappo Signing"
            # 同联机版：panic = "abort" 下 wry 里的 Objective-C 异常会直接终止程序。
            export CARGO_PROFILE_RELEASE_PANIC=unwind
          fi
          for attempt in 1 2 3; do
            npm run tauri build -- ${{ matrix.args }} --features standalone \
              --config src-tauri/tauri.standalone.conf.json -- --no-default-features && exit 0
            echo "build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: check the signature
        if: runner.os == 'macOS'
        run: scripts/macos_signing.sh verify client/src-tauri/target/universal-apple-darwin/release/bundle/macos/AsoulTappoOffline.app

      # 单机版不能带更新器的产物。
      - name: check that no updater files were made
        shell: bash
        run: |
          found="$(find client/src-tauri/target -path '*/bundle/*' \( -name '*.sig' -o -name 'latest.json' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) -print)"
          if [ -n "$found" ]; then echo "$found"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # 两个平台都打好、联机版的 Windows 任务建好 Release 之后才上传，Release 上不会只有半套单机版；它从不新建 Release。
  standalone-upload:
    name: Standalone upload
    needs: [windows-nsis, standalone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone
          merge-multiple: true

      - name: upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l standalone
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber standalone/AsoulTappoOffline_*
