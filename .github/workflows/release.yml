name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-nsis:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: v__VERSION__
          releaseName: AsoulTappo v__VERSION__
          releaseBody: |
            内测包，Windows NSIS 安装器。安装包未签名，SmartScreen 可能拦截，选择仍要运行即可。

            - Tauri 2 + Vue 3 桌宠与同桌联机
            - 面板改版：立式导航、各页布局，皮肤与表情展示优化
            - 新增三款睡衣派对皮肤与阿草彩蛋
            - 共鸣开包与揭晓演出重做，结果按抽取顺序展示
            - 联机动作同步拆分，最小化时保留抽卡结果
            - 服务端可自行部署，见 README

            仅 Windows。未做自动更新。
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          args: --bundles nsis
