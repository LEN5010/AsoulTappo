name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  windows-nsis:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: v__VERSION__
          releaseName: AsoulTappo v__VERSION__
          releaseBody: |
            内测包，Windows NSIS 安装器。安装包未签名，SmartScreen 可能拦截，选择仍要运行即可。

            - Tauri 2 + Vue 3 桌宠与同桌联机
            - 联机键鼠动作同步，图鉴内碎片兑换，皮肤卡面与装备预览
            - 新增 100 个表情（含 60 个动态图），普卡 45%、普通表情 40.5%
            - 跳过普通结果，保留大小隐藏和皮肤的揭晓动画
            - 服务端可自行部署，见 README

            仅 Windows。未做自动更新。
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          args: --bundles nsis
