name: Debug build

# Windows installer for testers. Not a release: the installer is only a workflow artifact,
# with no GitHub release and no updater files. test-* tags also build the signed macOS app.
# - debug-<version>, e.g. debug-1.0.3-debug.1: built with the detailed log (cargo feature
#   debug-log, see client/src-tauri/src/applog.rs).
# - test-<version>, e.g. test-1.0.5-rc.1: built like a release, without debug-log. The debug
#   build takes other code paths, so check this one on the test machine before tagging v*.
# <version> becomes the app version. A pre-release version sorts below the next real release,
# so testers are offered that update.
on:
  push:
    tags:
      - "debug-*"
      - "test-*"

jobs:
  windows-nsis:
    name: Windows NSIS (tester build)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - name: build
        working-directory: client
        shell: bash
        env:
          ASOULTAPPO_BUILD: ${{ github.ref_name }} ${{ github.sha }}
        # Bundling downloads the NSIS tools from GitHub releases, which sometimes answers 504;
        # a retry only repeats the bundling, the compiled program is reused.
        run: |
          case "$GITHUB_REF_NAME" in
            debug-*) version="${GITHUB_REF_NAME#debug-}"; features="--features debug-log" ;;
            test-*) version="${GITHUB_REF_NAME#test-}"; features="" ;;
          esac
          # The page reads its version from this (client/vite.config.ts), not from package.json.
          export ASOULTAPPO_VERSION="$version"
          for attempt in 1 2 3; do
            npm run tauri build -- --bundles nsis $features \
              --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":false}}" && exit 0
            echo "build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: AsoulTappo-${{ github.ref_name }}
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-app:
    name: macOS app (tester build)
    if: startsWith(github.ref_name, 'test-')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - name: import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/macos_signing.sh import

      - name: build
        working-directory: client
        env:
          ASOULTAPPO_BUILD: ${{ github.ref_name }} ${{ github.sha }}
          APPLE_SIGNING_IDENTITY: AsoulTappo Signing
          # Same as release.yml: with panic = "abort" an Objective-C exception inside wry kills the app.
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: |
          version="${GITHUB_REF_NAME#test-}"
          export ASOULTAPPO_VERSION="$version"
          npm run tauri build -- --target universal-apple-darwin --bundles app,dmg \
            --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: check the signature
        run: scripts/macos_signing.sh verify client/src-tauri/target/universal-apple-darwin/release/bundle/macos/AsoulTappo.app

      - uses: actions/upload-artifact@v4
        with:
          name: AsoulTappo-${{ github.ref_name }}-macos
          path: client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
