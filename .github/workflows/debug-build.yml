name: Debug build

# Windows installer for testers, built with the detailed log (cargo feature debug-log, see
# client/src-tauri/src/applog.rs). Not a release: the installer is only a workflow artifact,
# with no GitHub release and no updater files.
# Push a tag named debug-<version>, e.g. debug-1.0.3-debug.1; <version> becomes the app version.
# A pre-release version sorts below the next real release, so testers are offered that update.
on:
  push:
    tags:
      - "debug-*"

jobs:
  windows-nsis:
    name: Windows NSIS (debug log)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend dependencies
        working-directory: client
        run: npm ci

      - name: build
        working-directory: client
        shell: bash
        env:
          ASOULTAPPO_BUILD: ${{ github.ref_name }} ${{ github.sha }}
        # Bundling downloads the NSIS tools from GitHub releases, which sometimes answers 504;
        # a retry only repeats the bundling, the compiled program is reused.
        run: |
          version="${GITHUB_REF_NAME#debug-}"
          for attempt in 1 2 3; do
            npm run tauri build -- --bundles nsis --features debug-log \
              --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":false}}" && exit 0
            echo "build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: AsoulTappo-${{ github.ref_name }}
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
